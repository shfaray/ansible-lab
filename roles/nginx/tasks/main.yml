---
# tasks file for roles/nginx
- name: Установить nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Включить charset utf-8
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/charset.conf
    content: "charset utf-8;\n"
  notify: reload nginx

- name: Сгенерировать страницу из шаблона
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: "0644"

- name: Запустить nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
