---
- name: Установить PostgreSQL и вспомогательные пакеты
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2
      - acl
    state: present
    update_cache: true

- name: Запустить PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true