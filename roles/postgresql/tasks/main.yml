---
- name: Установить PostgreSQL и вспомогательные пакеты
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2
      - acl
    state: present
    update_cache: true

- name: Запустить PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Создать пользователя БД
  community.postgresql.postgresql_user:
    name: "{{ todo_db_user }}"
    password: "{{ todo_db_password }}"
  become_user: postgres
  no_log: true

- name: Создать базу данных
  community.postgresql.postgresql_db:
    name: "{{ todo_db_name }}"
    owner: "{{ todo_db_user }}"
  become_user: postgres

- name: Слушать на всех интерфейсах
  ansible.builtin.copy:
    dest: /etc/postgresql/18/main/conf.d/listen.conf
    content: "listen_addresses = '*'\n"
  notify: restart postgresql

- name: Разрешить подключение к БД из сети лаборатории
  ansible.builtin.lineinfile:
    path: /etc/postgresql/18/main/pg_hba.conf
    line: "host {{ todo_db_name }} {{ todo_db_user }} 192.168.77.0/24 scram-sha-256"
  notify: restart postgresql