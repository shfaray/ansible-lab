---
- name: Создать каталог проекта
  ansible.builtin.file:
    path: /opt/todo-app
    state: directory
    mode: "0755"

- name: Положить docker-compose.yml
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/todo-app/docker-compose.yml
    mode: "0644"

- name: Положить .env с секретами
  ansible.builtin.template:
    src: env.j2
    dest: /opt/todo-app/.env
    mode: "0600"
  no_log: true

- name: Поднять проект
  community.docker.docker_compose_v2:
    project_src: /opt/todo-app
    state: present
    pull: always